[project]
name = "ezmeans"
version = "0.0.1"
description = "ez-means: faster e-means clustering on CPU and GPU"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Kailas Mahavarkar" }]
requires-python = ">=3.13"
dependencies = ["numpy>=2.1"]

[project.optional-dependencies]
gpu = ["torch>=2.15", "triton>=3.9"]

[dependency-groups]
dev = ["ruff", "mypy", "pytest", "faiss-cpu>=1.16", "torch>=2.15", "triton>=3.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ezmeans"]

[tool.ruff]
line-length = 120

[tool.ruff.lint.isort]
known-first-party = ["ezmeans"]

[tool.mypy]
strict = true
mypy_path = "stubs"
