[project]
name = "ezmeans"
version = "0.1.1"
description = "ez-means: faster e-means clustering on CPU and GPU"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Kailas Mahavarkar" }]
requires-python = ">=3.13"
dependencies = ["numpy>=2.1"]

[project.optional-dependencies]
gpu = ["torch>=2.15", "triton>=3.9"]

[dependency-groups]
dev = ["ruff", "mypy", "pytest", "faiss-cpu>=1.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ezmeans"]

[tool.ruff]
line-length = 120

[tool.ruff.lint.isort]
known-first-party = ["ezmeans"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["triton", "triton.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["ezmeans.gpu.kernels"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
