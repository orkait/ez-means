[project]
name = "ezmeans"
version = "0.0.1"
description = "ez-means: faster e-means clustering on CPU"
license = "MIT"
authors = [{ name = "Kailas Mahavarkar" }]
requires-python = ">=3.13"
dependencies = [
    "numpy==2.5.4",
    "faiss-cpu==1.16.0",
    "scipy==1.18.1",
    "scikit-learn==1.9.1",
    "h5py==3.16.0",
]

[dependency-groups]
dev = ["ruff", "mypy", "pytest"]
cloud = ["modal==1.6.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ezmeans"]

[tool.ruff]
line-length = 120

[tool.ruff.lint.isort]
known-first-party = ["ezmeans"]

[tool.mypy]
strict = true
ignore_missing_imports = true
untyped_calls_exclude = ["faiss", "sklearn", "scipy"]
